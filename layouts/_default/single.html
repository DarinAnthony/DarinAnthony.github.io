{{ define "main" }}
<p class="crumb"><a href="/">← {{ .Site.Title }}</a> · <a href="/blog/">Blog</a></p>
<article class="post">
  <h1>{{ .Title }}</h1>
  <p class="meta">{{ .Date.Format "January 2, 2006" }}{{ with .ReadingTime }} · {{ . }} min read{{ end }}</p>
  {{ .Content }}
</article>
{{ end }}
